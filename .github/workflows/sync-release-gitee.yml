name: Sync release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag to resume syncing
        required: true
        default: v1.2.3

permissions:
  contents: read

concurrency:
  group: gitee-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test asset selection and resume behavior
        run: python3 -m unittest discover -s tests-ci -v
      - name: Sync selected verified attachments
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python3 scripts/sync_gitee_release.py --tag "$RELEASE_TAG"
