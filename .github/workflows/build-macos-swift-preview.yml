name: Build native macOS preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build native Swift application and run core tests
        run: |
          python3 -m unittest discover -s macos/Tests -p 'test_*.py'
          bash macos/build.sh '${{ matrix.arch }}'
      - name: Verify bundle and native menu bar
        run: |
          ditto -x -k artifacts/*-swift-preview-macos12-${{ matrix.arch }}.zip artifacts/mac-smoke
          artifacts/mac-smoke/'NBA Live.app'/Contents/MacOS/NBALiveMac --smoke-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-macos-preview-${{ matrix.arch }}
          path: |
            artifacts/*-swift-preview-macos12-*.zip
            artifacts/*-swift-preview-macos12-*.sha256
          if-no-files-found: error
